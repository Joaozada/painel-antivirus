<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão de Máquinas por Aba</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (Importação e Exportação de Excel / CSV) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Cabeçalho, Nome da Planilha, Exportar -->
        <div class="bg-white rounded-xl shadow-md p-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="w-full md:w-1/2">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Nome da Planilha / Projeto</label>
                <input type="text" id="projectName" value="Carregando..." 
                       class="text-2xl font-bold text-slate-800 w-full border-b-2 border-slate-300 focus:border-indigo-600 outline-none transition py-1 bg-transparent">
            </div>
            
            <!-- Botões de Exportação -->
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-end">
                <button onclick="exportarExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow-md transition flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Exportar Excel
                </button>
                <button onclick="exportarCSV()" class="bg-slate-700 hover:bg-slate-800 text-white font-semibold py-2.5 px-4 rounded-lg shadow-md transition flex items-center gap-2">
                    Exportar CSV
                </button>
            </div>
        </div>

        <!-- Indicador Único: Total de Máquinas + Campo de Pesquisa -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Total de Máquinas</p>
                    <p class="text-4xl font-black text-indigo-600 mt-2" id="cardTotalMaquinas">0</p>
                </div>
                <div class="bg-indigo-50 p-4 rounded-full text-indigo-600">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex items-center">
                <input type="text" id="searchInput" onkeyup="filtrarTabela()" placeholder="🔍 Pesquisar por Aba ou Nome de Máquina..." 
                       class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700">
            </div>
        </div>

        <!-- Tabela Principal sem Gráfico -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
            <h2 class="text-lg font-bold text-slate-800 mb-4">Detalhamento por Aba da Planilha</h2>
            <div class="overflow-x-auto max-h-[500px] rounded-lg border border-slate-200">
                <table class="w-full text-left border-collapse text-sm">
                    <thead class="sticky top-0 bg-slate-800 text-white z-10">
                        <tr>
                            <th class="p-3">Nome da Aba</th>
                            <th class="p-3 text-center">Qtd. Máquinas</th>
                            <th class="p-3 text-center">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200 text-slate-700">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Seção de Lista de Máquinas da Aba Selecionada -->
        <div id="sectionDetails" class="bg-white p-6 rounded-xl shadow-md border border-slate-200 hidden">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800">Máquinas da Aba: <span id="selectedSheetName" class="text-indigo-600"></span></h3>
                <button onclick="fecharDetalhes()" class="text-slate-400 hover:text-slate-600 text-sm font-bold bg-slate-100 px-3 py-1 rounded">✕ Fechar</button>
            </div>
            <div id="machineListContainer" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-2 max-h-60 overflow-y-auto p-3 bg-slate-50 rounded-lg border">
            </div>
        </div>

    </div>

    <script>
        let workbookData = [];

        // Carrega automaticamente o arquivo CRE.xlsx do mesmo diretório
        async function carregarPlanilhaAutomaticamente() {
            try {
                const response = await fetch('CRE.xlsx');
                
                if (!response.ok) {
                    throw new Error("Arquivo CRE.xlsx não foi encontrado na pasta.");
                }
                
                const arrayBuffer = await response.arrayBuffer();
                const data = new Uint8Array(arrayBuffer);
                const workbook = XLSX.read(data, { type: 'array' });

                processarDadosWorkbook(workbook, "CRE (Automático)");
                
            } catch (error) {
                console.warn("Aviso: O navegador bloqueou o carregamento automático local ou o arquivo não foi encontrado.", error);
                document.getElementById('projectName').value = "Erro no Carregamento";
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-slate-600 bg-amber-50">
                    <strong>Atenção:</strong> Não foi possível ler o arquivo <b>CRE.xlsx</b> automaticamente.<br>
                    Certifique-se de que o arquivo <b>CRE.xlsx</b> está na mesma pasta e que a aplicação está sendo executada através de um servidor local (ex: <b>Live Server</b> no VS Code).
                </td></tr>`;
            }
        }

        function processarDadosWorkbook(workbook, fileName) {
            document.getElementById('projectName').value = fileName;
            let parsedData = [];

            workbook.SheetNames.forEach(sheetName => {
                const worksheet = workbook.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                let machines = [];
                rows.forEach(row => {
                    if (Array.isArray(row)) {
                        row.forEach(cell => {
                            if (cell !== null && cell !== undefined) {
                                let str = String(cell).trim();
                                if (str !== '' && !['host name', 'hostname', 'maquinas', 'máquinas', 'total', 'total de máquinas'].includes(str.toLowerCase())) {
                                    machines.push(str);
                                }
                            }
                        });
                    }
                });

                let uniqueMachines = [...new Set(machines)];

                if (uniqueMachines.length > 0) {
                    parsedData.push({
                        sheet_name: sheetName.trim(),
                        count: uniqueMachines.length,
                        machines: uniqueMachines
                    });
                }
            });

            if (parsedData.length > 0) {
                workbookData = parsedData;
                atualizarDashboard(workbookData);
            } else {
                alert("A planilha foi lida, mas nenhuma máquina foi encontrada.");
            }
        }

        function atualizarDashboard(dados) {
            let totalMaquinas = 0;

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (dados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-slate-400">Nenhuma máquina encontrada.</td></tr>`;
                document.getElementById('cardTotalMaquinas').innerText = '0';
                return;
            }

            dados.forEach((item, index) => {
                totalMaquinas += item.count;

                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 ? 'bg-white hover:bg-indigo-50 transition' : 'bg-slate-50 hover:bg-indigo-50 transition';
                tr.innerHTML = `
                    <td class="p-3 font-semibold text-slate-800">${item.sheet_name}</td>
                    <td class="p-3 text-center font-bold text-indigo-600">${item.count}</td>
                    <td class="p-3 text-center">
                        <button onclick="verDetalhes('${item.sheet_name}')" class="px-3 py-1.5 text-xs font-semibold rounded bg-indigo-100 text-indigo-700 hover:bg-indigo-200 transition">
                            Ver Máquinas (${item.count})
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('cardTotalMaquinas').innerText = totalMaquinas;
        }

        function filtrarTabela() {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const dadosFiltrados = workbookData.filter(row => 
                row.sheet_name.toLowerCase().includes(input) || 
                row.machines.some(m => m.toLowerCase().includes(input))
            );
            atualizarDashboard(dadosFiltrados);
        }

        function verDetalhes(sheetName) {
            const item = workbookData.find(d => d.sheet_name === sheetName);
            if (!item) return;

            const container = document.getElementById('machineListContainer');
            const section = document.getElementById('sectionDetails');
            document.getElementById('selectedSheetName').innerText = sheetName;

            container.innerHTML = '';
            item.machines.forEach(m => {
                const div = document.createElement('div');
                div.className = 'bg-white p-2 text-xs rounded border border-slate-200 text-slate-700 font-mono text-center shadow-sm hover:border-indigo-400 transition';
                div.innerText = m;
                container.appendChild(div);
            });

            section.classList.remove('hidden');
            section.scrollIntoView({ behavior: 'smooth' });
        }

        function fecharDetalhes() {
            document.getElementById('sectionDetails').classList.add('hidden');
        }

        function exportarExcel() {
            let exportData = [];
            workbookData.forEach(item => {
                item.machines.forEach(m => {
                    exportData.push({
                        "Aba / Local": item.sheet_name,
                        "Nome da Máquina": m
                    });
                });
            });

            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Maquinas");
            
            const pName = document.getElementById('projectName').value.trim() || "Relatorio_Maquinas";
            XLSX.writeFile(wb, pName + ".xlsx");
        }

        function exportarCSV() {
            let exportData = [];
            workbookData.forEach(item => {
                item.machines.forEach(m => {
                    exportData.push({
                        "Aba / Local": item.sheet_name,
                        "Nome da Máquina": m
                    });
                });
            });

            const ws = XLSX.utils.json_to_sheet(exportData);
            const csv = XLSX.utils.sheet_to_csv(ws);
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            
            const pName = document.getElementById('projectName').value.trim() || "Relatorio_Maquinas";
            link.setAttribute("download", pName + ".csv");
            link.click();
        }

        // Tenta carregar automaticamente assim que a página é aberta
        window.addEventListener('DOMContentLoaded', carregarPlanilhaAutomaticamente);
    </script>
</body>
</html>
